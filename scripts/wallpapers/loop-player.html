<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self' file:; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>YinYang EQ wallpaper</title>
  <style>
    html, body { margin: 0; background: #061019; }
    video { display: block; width: 100vw; height: 100vh; object-fit: cover; }
  </style>
</head>
<body>
  <video loop muted playsinline poster="wallpaper.jpg" aria-label="Animated YinYang EQ wallpaper">
    <source src="wallpaper.mp4" type="video/mp4">
  </video>
  <script>
    const player = document.querySelector("video");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    function syncPlayback() {
      if (reducedMotion.matches || document.hidden) player.pause();
      else player.play().catch(() => {});
    }
    reducedMotion.addEventListener("change", syncPlayback);
    document.addEventListener("visibilitychange", syncPlayback);
    syncPlayback();
  </script>
</body>
</html>
